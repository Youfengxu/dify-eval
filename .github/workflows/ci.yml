name: ci

# Everything here runs offline. The unit tests use scripted transports and the
# demo case replays pre-recorded fixtures, so CI needs no API key and no model.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: python -m pip install -e .

      - name: unit tests
        run: python -m unittest discover -s tests

      - name: demo case validates and replays to PASS
        shell: bash
        run: |
          difyeval validate examples/text-source-discovery/case.yml
          difyeval score examples/text-source-discovery/case.yml --no-judge | tee score.log
          grep -q "verdict: PASS" score.log
