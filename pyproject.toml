[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "difyeval"
version = "0.1.0"
description = "Universal Dify eval pipeline: dataset x composable checks x experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Youfeng Xu"}]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.scripts]
difyeval = "difyeval.cli:main"

[tool.setuptools.packages.find]
include = ["difyeval*"]
